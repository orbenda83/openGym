name: Publish Docker images

# Publish candidates first; moving deployment tags are promoted only after every image and
# platform passes its scan. Promotion uses the scanned digest, never a second build.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            context: ./api
            file: ./api/Dockerfile
          - image: web
            context: .
            file: ./web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Registry and version metadata
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF" in
            refs/tags/*) version="${GITHUB_REF#refs/tags/}" ;;
            *) version="main-${GITHUB_SHA::7}" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.image.outputs.date }}
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/opengym-${{ matrix.image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true
      - name: Scan both platforms at the built digest
        env:
          IMAGE: ghcr.io/${{ steps.image.outputs.owner }}/opengym-${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          mkdir -p security-reports
          printf '%s\n' "$IMAGE_DIGEST" > "security-reports/$IMAGE_NAME.digest"
          rc=0
          for arch in amd64 arm64; do
            bash scripts/scan-image.sh "$IMAGE@$IMAGE_DIGEST" "security-reports/$IMAGE_NAME-$arch" "linux/$arch" || rc=1
          done
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: image-security-${{ matrix.image }}
          path: security-reports/
          retention-days: 90

  promote:
    # Matrix dependencies wait for both API and web builds/scans before promoting either.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-security-${{ matrix.image }}
          path: security-reports
      - name: Lowercase registry owner
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ steps.image.outputs.owner }}/opengym-${{ matrix.image }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Promote only the scanned digest
        env:
          IMAGE: ghcr.io/${{ steps.image.outputs.owner }}/opengym-${{ matrix.image }}
          IMAGE_NAME: ${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          digest=$(cat "security-reports/$IMAGE_NAME.digest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          while IFS= read -r tag; do
            [[ -z "$tag" ]] || docker buildx imagetools create --tag "$tag" "$IMAGE@$digest"
          done <<< "$TAGS"
          printf 'Pinned deployment image: `%s@%s`\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
