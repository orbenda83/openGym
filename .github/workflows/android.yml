name: Android

on:
  # The android job protects main, so it must emit a result for every PR.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'catalogue/**'
      - 'scripts/catalogue/**'
      - 'scripts/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release_version_code:
        description: 'Unsigned release version code (integer 28 through 2100000000)'
        type: string
        default: '28'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENGYM_VERSION_CODE: ${{ inputs.release_version_code || '28' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Use the hosted runner's existing accepted SDK licences.
          accept-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true
      - name: Validate local release safeguards
        run: python3 -m unittest discover -s scripts/android -p 'test_release_signing.py'
      - run: npm ci
        working-directory: frontend
      - name: Build and sync only the Android mobile bundle
        working-directory: frontend
        run: |
          VITE_MOBILE=1 npm run build
          node ../scripts/catalogue/stage-media.mjs dist
          npx cap sync android
          node --input-type=module -e '
            import { checkCopy } from "./scripts/check-mobile-bundle.mjs";
            const errors = ["dist", "android/app/src/main/assets/public"].flatMap(checkCopy);
            if (errors.length) throw new Error(errors.join("\n"));
            console.log("Android mobile bundle verified");
          '
      - name: Android unit tests, test APK, and unsigned release
        working-directory: frontend/android
        run: ./gradlew --no-daemon "-PopengymVersionCode=$OPENGYM_VERSION_CODE" testSideloadDebugUnitTest assembleSideloadDebug assembleSideloadRelease
      - name: Verify and checksum the test APK
        working-directory: frontend/android/app/build/outputs/apk/sideload/debug
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app-sideload-debug.apk
          sha256sum app-sideload-debug.apk > app-sideload-debug.apk.sha256
          printf 'Test APK only: ephemeral signing keys, application ID `live.orbenda.opengym.test`; cannot update prior test installs.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-test-apk-${{ github.sha }}
          path: |
            frontend/android/app/build/outputs/apk/sideload/debug/app-sideload-debug.apk
            frontend/android/app/build/outputs/apk/sideload/debug/app-sideload-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Verify unsigned release and record tested source
        working-directory: frontend/android/app/build/outputs/apk/sideload/release
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          PR_HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          APK=app-sideload-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > release-badging.txt
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"; then
            echo 'Release unexpectedly has a signature; refusing to upload.' >&2
            exit 1
          fi
          python3 - <<'PYTHON'
          import hashlib, json, os, re, zipfile
          from pathlib import Path
          apk = Path('app-sideload-release-unsigned.apk')
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None, 'Corrupt release APK'
              assert not any(re.match(r'META-INF/.*\.(RSA|DSA|EC|SF)$', name, re.I) for name in archive.namelist()), 'Release contains JAR signatures'
          badging = Path('release-badging.txt').read_text()
          package = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", badging, re.M)
          expected = ('live.orbenda.opengym', os.environ['OPENGYM_VERSION_CODE'], '1.4.3')
          assert package and package.groups() == expected, f'Unexpected package/version: {package}'
          assert re.search(r"^sdkVersion:'24'$", badging, re.M), 'Unexpected min SDK'
          assert re.search(r"^targetSdkVersion:'36'$", badging, re.M), 'Unexpected target SDK'
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          Path(str(apk) + '.sha256').write_text(f'{digest}  {apk.name}\n')
          provenance = dict(
              schemaVersion=1, repository=os.environ['REPOSITORY'], runId=os.environ['RUN_ID'],
              sourceCommit=os.environ['SOURCE_COMMIT'], applicationId=expected[0],
              versionCode=int(expected[1]), versionName=expected[2], apkFile=apk.name, apkSha256=digest,
              eventName=os.environ['EVENT_NAME'], ref=os.environ['SOURCE_REF'],
              prHeadCommit=os.environ['PR_HEAD_COMMIT'] or None,
              testedSourceType='pr-merge-commit' if os.environ['EVENT_NAME'] == 'pull_request' else 'branch-commit',
              minSdk=24, targetSdk=36, signing='unsigned')
          Path('release-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PYTHON
          printf 'Unsigned production release verified: `live.orbenda.opengym`, version code `%s`. Requires permanent local signing before installation. Source: `%s` (%s, %s).\n' "$OPENGYM_VERSION_CODE" "$SOURCE_COMMIT" "$EVENT_NAME" "$SOURCE_REF" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-unsigned-release-${{ github.sha }}
          path: |
            frontend/android/app/build/outputs/apk/sideload/release/app-sideload-release-unsigned.apk
            frontend/android/app/build/outputs/apk/sideload/release/app-sideload-release-unsigned.apk.sha256
            frontend/android/app/build/outputs/apk/sideload/release/release-provenance.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-unit-test-results-${{ github.sha }}
          path: frontend/android/app/build/test-results/testSideloadDebugUnitTest/
          retention-days: 14
